name: Zero-Touch ECS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "977232999886"
  ECR_REPOSITORY: capstone3-node-app
  ECS_CLUSTER: capstone3-cluster
  ECS_SERVICE: capstone3-service
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: Test, Lint, Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies and run tests
        working-directory: app
        run: |
          npm ci
          npm test

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint plugins
        run: tflint --chdir=terraform --init

      - name: Lint Terraform configuration
        run: tflint --chdir=terraform

      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`OIDC audience: ${payload.aud}`);
            core.info(`Repository: ${payload.repository}`);
            core.info(`Repository ID: ${payload.repository_id}`);

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::977232999886:role/Capstone3GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Capture previous ECS task definition
        id: previous-task
        shell: bash
        run: |
          set -euo pipefail

          PREVIOUS_TASK_DEFINITION="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          if [[ -z "$PREVIOUS_TASK_DEFINITION" ||
                "$PREVIOUS_TASK_DEFINITION" == "None" ]]; then
            echo "::error::Could not determine the previous ECS task definition."
            exit 1
          fi

          echo "Previous task definition: $PREVIOUS_TASK_DEFINITION"
          echo "task_definition=$PREVIOUS_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Image tag $IMAGE_TAG already exists; reusing it."
          else
            docker build \
              -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
              ./app

            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Deploy infrastructure and application
        working-directory: terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -var="image_tag=${GITHUB_SHA}"

      - name: Wait for ECS stability and verify application health
        env:
          PREVIOUS_TASK_DEFINITION: ${{ steps.previous-task.outputs.task_definition }}
        shell: bash
        run: |
          set -euo pipefail

          rollback_to_previous() {
            echo "::error::Deployment verification failed. Restoring the previous ECS task definition."

            CURRENT_TASK_DEFINITION="$(
              aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "$ECS_SERVICE" \
                --region "$AWS_REGION" \
                --query 'services[0].taskDefinition' \
                --output text
            )"

            if [[ "$CURRENT_TASK_DEFINITION" != "$PREVIOUS_TASK_DEFINITION" ]]; then
              aws ecs update-service \
                --cluster "$ECS_CLUSTER" \
                --service "$ECS_SERVICE" \
                --region "$AWS_REGION" \
                --task-definition "$PREVIOUS_TASK_DEFINITION"
            else
              echo "The service already references the previous task definition."
            fi

            echo "Waiting for the rollback to stabilize..."

            if aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION"; then
              echo "The ECS service is stable after rollback."
            else
              echo "::error::Rollback was requested, but service stability was not confirmed."
              aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "$ECS_SERVICE" \
                --region "$AWS_REGION" \
                --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,TaskDefinition:taskDefinition,Deployments:deployments[*].rolloutState}' \
                --output json || true
            fi

            exit 1
          }

          echo "Waiting for ECS deployment stability..."

          if ! aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"; then
            echo "::error::ECS did not become stable."
            rollback_to_previous
          fi

          ALB_DNS="$(
            terraform -chdir=terraform output -raw alb_dns_name
          )"

          HEALTH_URL="http://${ALB_DNS}/health"
          DEADLINE=$((SECONDS + 300))

          echo "Checking application health for up to five minutes: $HEALTH_URL"

          while (( SECONDS < DEADLINE )); do
            RESPONSE="$(
              curl --fail --silent --show-error \
                --max-time 5 \
                "$HEALTH_URL" 2>/dev/null || true
            )"

            if [[ "$RESPONSE" == '{"status":"healthy"}' ]]; then
              echo "Application health check passed."
              echo "Health response: $RESPONSE"
              exit 0
            fi

            echo "Health check has not passed yet; retrying..."
            sleep 5
          done

          echo "::error::Application health check did not pass within five minutes."
          rollback_to_previous

      - name: Verify final ECS deployment
        if: always()
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount,TaskDefinition:taskDefinition,CircuitBreaker:deploymentConfiguration.deploymentCircuitBreaker,Deployments:deployments[*].rolloutState}' \
            --output json
